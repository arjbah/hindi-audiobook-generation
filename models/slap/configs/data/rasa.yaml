_target_: src.data.rasa_dataset.RasaDataModule

# Rasa subset used for training and in-domain eval: male, female or both.
# IndicVoices is never filtered.
gender: both
# Truncate every split to N rows. Smoke tests only.
limit: null

tokenizer:
  _target_: src.tokenizer.base.HuggingFaceTokenizer
  max_sequence_length: 128
  truncation: longest_first
  padding: longest
  return_special_tokens_mask: false
  return_attention_mask: true

dataloader_kwargs:
  # Global batch size. RasaDataModule divides this across trainer devices.
  batch_size: 128
  num_workers: 4
  pin_memory: true
  devices: ${trainer.devices}
