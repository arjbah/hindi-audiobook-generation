task_name: train
tags:
- dev
train: true
test: true
ckpt_path: null
seed: 1
resume: false
data:
  _target_: src.data.rasa_dataset.RasaDataModule
  tokenizer:
    _target_: src.tokenizer.base.HuggingFaceTokenizer
    max_sequence_length: 128
    truncation: longest_first
    padding: longest
    return_special_tokens_mask: false
    return_attention_mask: true
  dataloader_kwargs:
    batch_size: 128
    num_workers: 4
    pin_memory: true
    devices: 1
model:
  _target_: src.models.slap.SLAP
  audio_encoder:
    _target_: src.networks.siamese_arm.SiameseArm
    encoder:
      _target_: src.networks.audio.htsat.HTSATSwinTransformer
      spec_size: 256
      patch_size: 4
      patch_stride:
      - 4
      - 4
      embed_dim: 96
      depths:
      - 2
      - 2
      - 6
      - 2
      num_heads:
      - 4
      - 8
      - 16
      - 32
      window_size: 8
      mel_bins: 64
      sample_rate: 32000
      spec_window_size: 1024
      hop_size: 320
      fmin: 50
      fmax: 14000
      precomputed_lms: false
      checkpoint_path: ./pretrained/HTSAT_AudioSet_Saved_6.ckpt
    projector:
      _target_: src.networks.mlp.MLP
      dims:
      - 768
      - 512
      - 512
      activation: true
      normalization: true
    transform:
      _target_: src.networks.mlp.MLP
      dims:
      - 512
      - 4096
      - 512
      activation: true
      normalization: false
      dropout: 0.1
    freeze_encoder: false
    normalize_representations: false
    normalize_projections: true
    checkpoint_path: null
  text_encoder:
    _target_: src.networks.siamese_arm.SiameseArm
    encoder:
      _target_: src.networks.text.bert.HuggingFaceTextEncoder
      model_name: google/muril-base-cased
      load_pretrained: true
    projector:
      _target_: src.networks.mlp.MLP
      dims:
      - 768
      - 512
      - 512
      activation: true
      normalization: true
    transform:
      _target_: src.networks.mlp.MLP
      dims:
      - 512
      - 4096
      - 512
      activation: true
      normalization: false
      dropout: 0.1
    freeze_encoder: false
    normalize_representations: false
    normalize_projections: true
  loss_fn:
    _target_: src.utils.losses.BYOLLoss
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.0001
    weight_decay: 1.0e-06
  scheduler:
    _target_: src.utils.scheduler.LinearWarmupCosineAnnealingLR
    _partial_: true
    warmup_epochs: 10
  embed_dim: 512
  compile: false
  ma_callback:
    _target_: src.callbacks.ma_update.MAWeightUpdate
    every_n_steps: 1
    initial_tau: 0.95
    final_tau: 0.95
    update_method: lin
callbacks:
  model_checkpoint_best:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: /home/ubuntu/slap/logs/xps/4e404023/checkpoints
    verbose: true
    save_last: true
    save_top_k: 1
    mode: max
    monitor: Retrieval/val_0/predictions/T2A/R@1
    auto_insert_metric_name: false
    filename: best_{epoch:02d}_rasa_t2a_r1_{Retrieval/val_0/predictions/T2A/R@1:.3f}
    save_weights_only: false
    every_n_epochs: 1
  retrieval_callback:
    _target_: src.callbacks.retrieval.RetrievalEvaluation
    distance: cosine
    log_path: /home/ubuntu/slap/logs/xps/4e404023/train_log.txt
    dataset_names:
    - Rasa
    - IndicVoices
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 1
  progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: /home/ubuntu/slap/logs/xps/4e404023
  min_epochs: 1
  max_epochs: 240
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  check_val_every_n_epoch: 1
  deterministic: false
  gradient_clip_val: 3.0
  accumulate_grad_batches: 1
paths:
  root_dir: .
  data_dir: ./data
  log_dir: ./logs/
  pretrained: ./pretrained
  output_dir: /home/ubuntu/slap/logs/xps/4e404023
  ckpt_dir: /home/ubuntu/slap/logs/xps/4e404023/checkpoints
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
  save_config: true
dora:
  dir: ./logs/
  exclude:
  - callbacks.*
  - data.num_workers
  - data.dataloader_kwargs.pin_memory
  - data.dataloader_kwargs.prefetch_factor
  - data.dataloader.persistent_workers
  - extras.*
  - logger.*
  - model.compile
  - paths.*
  - trainer.accelerator
  - trainer.devices
  - trainer.check_val_every_n_epoch
  - trainer.default_root_dir
  - trainer.min_epochs
  - trainer.num_sanity_val_steps
  - trainer.log_every_n_steps
  - resume
  git_save: false
